<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1c2431"/><rect x="30" y="25" width="900" height="490" fill="#efeee7" stroke="#fff" stroke-width="3"/><rect x="33" y="28" width="894" height="42" fill="#384b88"/><text x="54" y="57" fill="white" font-family="monospace" font-size="19" font-weight="bold">FLAGSHIP / DESIGN NOTES</text><text x="63" y="116" fill="#20263c" font-family="monospace" font-size="23">What are we building?</text><rect x="60" y="146" width="840" height="104" fill="#fff" stroke="#aaa"/><text x="78" y="182" fill="#263449" font-family="monospace" font-size="16">A small, shared project with a clear problem and public work.</text><text x="78" y="215" fill="#5a6570" font-family="monospace" font-size="15">Start with examples, then agree on the smallest useful release.</text><rect x="60" y="275" width="404" height="183" fill="#e1ebf5" stroke="#90a8ba"/><text x="78" y="311" fill="#23476b" font-family="monospace" font-size="18" font-weight="bold">SCOPE</text><text x="78" y="348" fill="#263449" font-family="monospace" font-size="15">• one workflow</text><text x="78" y="381" fill="#263449" font-family="monospace" font-size="15">• observable results</text><text x="78" y="414" fill="#263449" font-family="monospace" font-size="15">• tests before polish</text><rect x="491" y="275" width="409" height="183" fill="#e1f0e5" stroke="#97b99e"/><text x="509" y="311" fill="#2a6240" font-family="monospace" font-size="18" font-weight="bold">TEAM</text><text x="509" y="348" fill="#263449" font-family="monospace" font-size="15">• Member contributors</text><text x="509" y="381" fill="#263449" font-family="monospace" font-size="15">• Maintainer review</text><text x="509" y="414" fill="#263449" font-family="monospace" font-size="15">• open project journal</text>
</svg>
